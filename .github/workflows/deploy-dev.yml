# .github/workflows/deploy.yml
name: Build and Deploy on dev branch

on:
  push:
    branches:
      - dev          # Only deploy from dev branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/deploy/tfd-b5-backend
            git pull origin dev
            docker compose -f docker-compose.dev.yml -p backend-dev build --no-cache
            docker compose -f docker-compose.dev.yml -p backend-dev up -d --remove-orphans
            docker image prune -f
